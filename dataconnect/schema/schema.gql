# Railway Reservation System Schema
# This schema defines the data structure for the railway reservation system

# Users collection - stores user authentication and profile data
type User @table {
  id: String! @col(name: "user_id")
  email: String! @col(name: "email", dataType: "varchar(255)")
  firstName: String! @col(name: "first_name", dataType: "varchar(100)")
  lastName: String! @col(name: "last_name", dataType: "varchar(100)")
  avatar: String @col(name: "avatar_url", dataType: "varchar(500)")
  token: String @col(name: "auth_token", dataType: "text")
  createdAt: Date! @default(expr: "request.time")
}

# Trains collection - stores train information
type Train @table {
  id: String! @col(name: "train_id")
  trainNo: String! @col(name: "train_number", dataType: "varchar(20)")
  trainName: String! @col(name: "train_name", dataType: "varchar(200)")
  fromCity: String! @col(name: "from_city", dataType: "varchar(100)")
  toCity: String! @col(name: "to_city", dataType: "varchar(100)")
  seatsAvailable: Int! @col(name: "seats_available")
  trainType: String! @col(name: "train_type", dataType: "varchar(50)")
  frequency: String! @col(name: "frequency", dataType: "varchar(50)")
  departureDateTime: String! @col(name: "departure_datetime", dataType: "varchar(50)")
  destinationDateTime: String! @col(name: "destination_datetime", dataType: "varchar(50)")
  ticketPrice: String! @col(name: "ticket_price", dataType: "varchar(20)")
  createdAt: Date! @default(expr: "request.time")
}

# Reservations collection - stores booking information
type Reservation @table {
  id: String! @col(name: "reservation_id")
  referenceNo: String! @col(name: "reference_number", dataType: "varchar(50)")
  email: String! @col(name: "user_email", dataType: "varchar(255)")
  trainId: String! @col(name: "train_id", dataType: "varchar(100)")
  fromCity: String! @col(name: "from_city", dataType: "varchar(100)")
  toCity: String! @col(name: "to_city", dataType: "varchar(100)")
  numTickets: Int! @col(name: "number_of_tickets")
  seatPreferences: [String!]! @col(name: "seat_preferences")
  dateTime: String! @col(name: "booking_datetime", dataType: "varchar(50)")
  status: String! @col(name: "status", dataType: "varchar(20)") @default(expr: "'confirmed'")
  createdAt: Date! @default(expr: "request.time")
  
  # Relationships
  user: User! @ref(fields: ["email"], references: ["email"])
  train: Train! @ref(fields: ["trainId"], references: ["id"])
}
